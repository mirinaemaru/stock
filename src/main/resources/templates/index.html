<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Stock Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="layout">
        <!-- 좌측 메뉴 영역 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>📊 Stock System</h1>
            </div>
            
            <div class="menu-tree">
                <div class="menu-item expanded">
                    <div class="menu-label" onclick="toggleMenu(this)">
                        <span class="menu-icon">📈</span>
                        <span>주식 관리</span>
                        <span class="menu-arrow">▶</span>
                    </div>
                    <div class="menu-children">
                        <div class="menu-child active" onclick="loadContent('dashboard')">대시보드</div>
                        <div class="menu-child" onclick="loadContent('stock-list')">주식 목록</div>
                        <div class="menu-child" onclick="loadContent('stock-add')">주식 등록</div>
                    </div>
                </div>
                
                <div class="menu-item">
                    <div class="menu-label" onclick="toggleMenu(this)">
                        <span class="menu-icon">📊</span>
                        <span>분석</span>
                        <span class="menu-arrow">▶</span>
                    </div>
                    <div class="menu-children">
                        <div class="menu-child" onclick="loadContent('analysis')">차트 분석</div>
                        <div class="menu-child" onclick="loadContent('reports')">리포트</div>
                    </div>
                </div>
                
                <div class="menu-item">
                    <div class="menu-label" onclick="toggleMenu(this)">
                        <span class="menu-icon">⚙️</span>
                        <span>설정</span>
                        <span class="menu-arrow">▶</span>
                    </div>
                    <div class="menu-children">
                        <div class="menu-child" onclick="loadContent('settings')">시스템 설정</div>
                        <div class="menu-child" onclick="loadContent('users')">사용자 관리</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 메뉴 토글 버튼 -->
        <div class="menu-toggle-container" onclick="toggleSidebar()" id="menuToggleContainer" title="메뉴 열기/닫기">
            <button class="menu-toggle-btn" id="menuToggleBtn">
                ◀
            </button>
        </div>
        
        <!-- 우측 내용 영역 -->
        <div class="content-area">
            <div class="content-header">
                <h2 id="content-title">대시보드</h2>
            </div>
            
            <div class="content-body" id="content-body">
                <div class="welcome-card">
                    <h3 th:text="${title}">Stock Management System</h3>
                    <p th:text="${message}">주식 관리 시스템에 오신 것을 환영합니다!</p>
                </div>
                
                <div class="info-grid">
                    <div class="info-card">
                        <h4>📊 시스템 상태</h4>
                        <p>정상 실행 중</p>
                    </div>
                    <div class="info-card">
                        <h4>🌐 서버 포트</h4>
                        <p>8080</p>
                    </div>
                    <div class="info-card">
                        <h4>💾 데이터베이스</h4>
                        <p>MariaDB 연결됨</p>
                    </div>
                    <div class="info-card">
                        <h4>🔧 프레임워크</h4>
                        <p>Spring Boot 2.7.18</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('menuToggleBtn');
            const toggleContainer = document.getElementById('menuToggleContainer');
            
            sidebar.classList.toggle('collapsed');
            
            // 버튼 위치 및 아이콘 변경
            if (sidebar.classList.contains('collapsed')) {
                toggleContainer.style.left = '0px';
                toggleBtn.innerHTML = '▶';
                toggleContainer.title = '메뉴 열기';
            } else {
                toggleContainer.style.left = '280px';
                toggleBtn.innerHTML = '◀';
                toggleContainer.title = '메뉴 닫기';
            }
        }
        
        function toggleMenu(element) {
            const menuItem = element.parentElement;
            menuItem.classList.toggle('expanded');
        }
        
        function loadContent(page) {
            // 활성 메뉴 업데이트
            document.querySelectorAll('.menu-child').forEach(item => {
                item.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 제목 업데이트
            const titles = {
                'dashboard': '대시보드',
                'stock-list': '주식 목록',
                'stock-add': '주식 등록',
                'analysis': '차트 분석',
                'reports': '리포트',
                'settings': '시스템 설정',
                'users': '사용자 관리'
            };
            
            document.getElementById('content-title').textContent = titles[page] || '대시보드';
            
            // 내용 업데이트 (실제로는 서버에서 데이터를 가져와야 함)
            const contentBody = document.getElementById('content-body');
            contentBody.innerHTML = `
                <div class="welcome-card">
                    <h3>${titles[page]}</h3>
                    <p>이 페이지는 현재 개발 중입니다.</p>
                </div>
                <div class="info-card">
                    <h4>페이지 정보</h4>
                    <p>선택한 메뉴: ${titles[page]}</p>
                    <p>이 기능은 추후 구현될 예정입니다.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
