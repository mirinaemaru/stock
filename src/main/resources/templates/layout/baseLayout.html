<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Stock Management System' : 'Stock Management System'}">Stock Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="layout">
        <!-- 좌측 메뉴 영역 -->
        <div th:replace="~{layout/menu :: menu}"></div>
        
        <!-- 메뉴 토글 버튼 -->
        <div class="menu-toggle-container" onclick="toggleSidebar()" id="menuToggleContainer" title="메뉴 열기/닫기">
            <button class="menu-toggle-btn" id="menuToggleBtn">◀</button>
        </div>
        
        <!-- 우측 내용 영역 -->
        <div class="content-area">
            <div class="content-header">
                <h2 id="content-title" th:text="${headerTitle != null ? headerTitle : '대시보드'}">대시보드</h2>
            </div>
            
            <div class="content-body" id="content-body">
                <!-- 내용이 여기에 삽입됩니다 -->
                <th:block th:replace="${contentFragment}"></th:block>
            </div>
        </div>
    </div>
    
    <script th:fragment="script">
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('menuToggleBtn');
            const toggleContainer = document.getElementById('menuToggleContainer');
            
            sidebar.classList.toggle('collapsed');
            
            // 버튼 위치 및 아이콘 변경
            if (sidebar.classList.contains('collapsed')) {
                toggleContainer.style.left = '0px';
                toggleBtn.innerHTML = '▶';
                toggleContainer.title = '메뉴 열기';
            } else {
                toggleContainer.style.left = '280px';
                toggleBtn.innerHTML = '◀';
                toggleContainer.title = '메뉴 닫기';
            }
            
            // sidebar 상태를 localStorage에 저장
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        }
        
        // sidebar 상태 저장
        function saveSidebarState() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            }
        }
        
        // sidebar 상태 복원
        function restoreSidebarState() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('menuToggleBtn');
            const toggleContainer = document.getElementById('menuToggleContainer');
            
            if (sidebar && toggleBtn && toggleContainer) {
                const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
                if (isCollapsed) {
                    sidebar.classList.add('collapsed');
                    toggleContainer.style.left = '0px';
                    toggleBtn.innerHTML = '▶';
                    toggleContainer.title = '메뉴 열기';
                } else {
                    sidebar.classList.remove('collapsed');
                    toggleContainer.style.left = '280px';
                    toggleBtn.innerHTML = '◀';
                    toggleContainer.title = '메뉴 닫기';
                }
            }
        }
        
        function toggleMenu(element) {
            const menuItem = element.parentElement;
            menuItem.classList.toggle('expanded');
        }
        
        // 페이지 로드 시 sidebar 상태 복원
        document.addEventListener('DOMContentLoaded', function() {
            restoreSidebarState();
        });
    </script>
    <!-- 페이지별 스타일 -->
    <th:block th:if="${contentStyle}" th:replace="${contentStyle}"></th:block>
    <!-- 페이지별 스크립트 -->
    <th:block th:if="${contentScript}" th:replace="${contentScript}"></th:block>
</body>
</html>
