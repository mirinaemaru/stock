<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="menu" class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>📊 Stock System</h1>
        </div>
        
        <div class="menu-tree">
            <div class="menu-item expanded">
                <div class="menu-label">
                    <span class="menu-icon">📈</span>
                    <span>주식 관리</span>
                    <span class="menu-arrow">▶</span>
                </div>
                <div class="menu-children">
                    <a th:href="@{/dashboard}" class="menu-child" th:classappend="${#httpServletRequest.requestURI == '/dashboard' ? 'active' : ''}">대시보드</a>
                    <a th:href="@{/stock/list}" class="menu-child" th:classappend="${#httpServletRequest.requestURI == '/stock/list' ? 'active' : ''}">주식 목록</a>
                    <a th:href="@{/stock/add}" class="menu-child" th:classappend="${#httpServletRequest.requestURI == '/stock/add' ? 'active' : ''}">주식 등록</a>
                </div>
            </div>
            
            <div class="menu-item">
                <div class="menu-label">
                    <span class="menu-icon">📊</span>
                    <span>분석</span>
                    <span class="menu-arrow">▶</span>
                </div>
                <div class="menu-children">
                    <a th:href="@{/stock/analysis}" class="menu-child" th:classappend="${#httpServletRequest.requestURI == '/stock/analysis' ? 'active' : ''}">종목분석</a>
                    <a th:href="@{/analysis/kospi-daily}" class="menu-child" th:classappend="${#httpServletRequest.requestURI == '/analysis/kospi-daily' ? 'active' : ''}">코스피 거래일 정보</a>
                </div>
            </div>
            
            <div class="menu-item">
                <div class="menu-label">
                    <span class="menu-icon">⚙️</span>
                    <span>설정</span>
                    <span class="menu-arrow">▶</span>
                </div>
                <div class="menu-children">
                    <a th:href="@{/settings}" class="menu-child" th:classappend="${#httpServletRequest.requestURI == '/settings' ? 'active' : ''}">시스템 설정</a>
                    <a th:href="@{/users}" class="menu-child" th:classappend="${#httpServletRequest.requestURI == '/users' ? 'active' : ''}">사용자 관리</a>
                </div>
            </div>
        </div>
        
        <!-- jQuery CDN (최신 버전) -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        
        <script>
            // 메뉴 시스템 초기화 - 순수 JavaScript로 간단하게 구현
            (function() {
                'use strict';
                
                // 메뉴 토글 함수
                function toggleMenu(menuItem) {
                    if (!menuItem) return;
                    
                    var allMenuItems = document.querySelectorAll('.menu-item');
                    allMenuItems.forEach(function(item) {
                        if (item !== menuItem) {
                            item.classList.remove('expanded');
                        }
                    });
                    menuItem.classList.toggle('expanded');
                    console.log('메뉴 토글:', menuItem.classList.contains('expanded') ? '열림' : '닫힘');
                }
                
                // 메뉴 초기화 함수
                function initializeMenu() {
                    console.log('메뉴 초기화 시작');
                    
                    // 활성화된 메뉴 항목의 부모 메뉴를 열린 상태로 설정
                    var activeMenuChild = document.querySelector('.menu-child.active');
                    if (activeMenuChild) {
                        var parentMenuItem = activeMenuChild.closest('.menu-item');
                        if (parentMenuItem) {
                            parentMenuItem.classList.add('expanded');
                        }
                    }
                    
                    // 이벤트 위임을 사용하여 클릭 이벤트 처리
                    // 이미 등록된 리스너가 있으면 중복 실행될 수 있으므로 확인
                    if (window.menuListenerAdded) return;
                    
                    document.addEventListener('click', function(e) {
                        // menu-arrow 클릭 확인 (먼저 처리)
                        var menuArrow = e.target.closest('.menu-arrow');
                        if (menuArrow) {
                            e.preventDefault();
                            e.stopPropagation();
                            var menuItem = menuArrow.closest('.menu-item');
                            if (menuItem) {
                                console.log('menu-arrow 클릭');
                                toggleMenu(menuItem);
                            }
                            return;
                        }
                        
                        // menu-label 클릭 확인
                        var menuLabel = e.target.closest('.menu-label');
                        if (menuLabel) {
                            // menu-child나 menu-arrow 클릭은 무시
                            if (e.target.closest('.menu-child')) {
                                return; // 링크로 이동 허용
                            }
                            if (e.target.closest('.menu-arrow')) {
                                return; // 이미 처리됨
                            }
                            
                            e.preventDefault();
                            e.stopPropagation();
                            
                            var menuItem = menuLabel.closest('.menu-item');
                            if (menuItem) {
                                console.log('menu-label 클릭');
                                toggleMenu(menuItem);
                            }
                            return;
                        }
                    }, true); // capture phase에서 처리하여 다른 이벤트보다 먼저 실행
                    
                    window.menuListenerAdded = true;
                    console.log('메뉴 초기화 완료');
                }
                
                // DOM 로드 완료 후 실행
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initializeMenu);
                } else {
                    // 이미 로드된 경우 즉시 실행
                    initializeMenu();
                }
            })();
        </script>
    </div>
</body>
</html>
