<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/baseLayout}">
<head>
    <title>대시보드</title>
</head>
<body>
    <div layout:fragment="header-title">대시보드</div>
    <div layout:fragment="content">
        <div class="welcome-card">
            <h3>Stock Management System</h3>
            <p>주식 관리 시스템에 오신 것을 환영합니다!</p>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <h4>📊 시스템 상태</h4>
                <p>정상 실행 중</p>
            </div>
            <div class="info-card">
                <h4>🌐 서버 포트</h4>
                <p>9090</p>
            </div>
            <div class="info-card">
                <h4>💾 데이터베이스</h4>
                <p>MariaDB 연결됨</p>
            </div>
            <div class="info-card">
                <h4>🔧 프레임워크</h4>
                <p>Spring Boot 2.7.18</p>
            </div>
        </div>
    </div>
</body>
</html>
