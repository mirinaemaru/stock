<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/baseLayout}">
<head>
    <title>주식 등록</title>
</head>
<body>
    <div layout:fragment="header-title">주식 등록</div>
    <div layout:fragment="content">
        <div class="welcome-card">
            <h3>주식 등록</h3>
            <p>새로운 주식을 등록할 수 있습니다.</p>
        </div>

        <div class="info-card">
            <h4>주식 등록 기능</h4>
            <p>이 기능은 추후 구현될 예정입니다.</p>
            <p>주식 정보를 입력하여 등록할 수 있는 폼이 제공됩니다.</p>
        </div>
    </div>
</body>
</html>
