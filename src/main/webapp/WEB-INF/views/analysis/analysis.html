<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/baseLayout}">
<head>
    <title>차트 분석</title>
</head>
<body>
    <div layout:fragment="header-title">차트 분석</div>
    <div layout:fragment="content">
        <div class="welcome-card">
            <h3>차트 분석</h3>
            <p>주식 차트를 분석할 수 있습니다.</p>
        </div>

        <div class="info-card">
            <h4>차트 분석 기능</h4>
            <p>이 기능은 추후 구현될 예정입니다.</p>
            <p>주식 차트를 시각화하고 분석할 수 있는 기능이 제공됩니다.</p>
        </div>
    </div>
</body>
</html>
